name: privatemesh

x-service-build: &service-build
  context: ../..
  dockerfile: Dockerfile

x-service-environment: &service-environment
  PRIVATEMESH_LOG_LEVEL: ${PRIVATEMESH_LOG_LEVEL:-info}
  PRIVATEMESH_SHUTDOWN_TIMEOUT: ${PRIVATEMESH_SHUTDOWN_TIMEOUT:-10s}

services:
  coordinator:
    build:
      <<: *service-build
      args:
        SERVICE: coordinator
    environment:
      <<: *service-environment
      PRIVATEMESH_COORDINATOR_HTTP_ADDRESS: :8080
    ports:
      - "${PRIVATEMESH_COORDINATOR_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  search-node-a:
    build:
      <<: *service-build
      args:
        SERVICE: search-node
    environment:
      <<: *service-environment
      PRIVATEMESH_SEARCH_NODE_HTTP_ADDRESS: :8090
      PRIVATEMESH_NODE_DATA_DIR: /var/lib/privatemesh
    ports:
      - "${PRIVATEMESH_NODE_A_HOST_PORT:-18091}:8090"
    volumes:
      - node-a-data:/var/lib/privatemesh
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  search-node-b:
    build:
      <<: *service-build
      args:
        SERVICE: search-node
    environment:
      <<: *service-environment
      PRIVATEMESH_SEARCH_NODE_HTTP_ADDRESS: :8090
      PRIVATEMESH_NODE_DATA_DIR: /var/lib/privatemesh
    ports:
      - "${PRIVATEMESH_NODE_B_HOST_PORT:-18092}:8090"
    volumes:
      - node-b-data:/var/lib/privatemesh
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  node-a-data:
  node-b-data:

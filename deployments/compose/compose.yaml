name: privatemesh

x-service-build: &service-build
  context: ../..
  dockerfile: Dockerfile

x-service-environment: &service-environment
  PRIVATEMESH_LOG_LEVEL: ${PRIVATEMESH_LOG_LEVEL:-info}
  PRIVATEMESH_SHUTDOWN_TIMEOUT: ${PRIVATEMESH_SHUTDOWN_TIMEOUT:-10s}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  coordinator:
    build:
      <<: *service-build
      args:
        SERVICE: coordinator
    environment:
      <<: *service-environment
      PRIVATEMESH_DEMO_MODE: "true"
      PRIVATEMESH_COORDINATOR_HTTP_ADDRESS: :8080
      PRIVATEMESH_COORDINATOR_GRPC_ADDRESS: :8081
    ports:
      - "${PRIVATEMESH_COORDINATOR_HOST_PORT:-18080}:8080"
      - "${PRIVATEMESH_COORDINATOR_GRPC_HOST_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  search-node-a:
    build:
      <<: *service-build
      args:
        SERVICE: search-node
    environment:
      <<: *service-environment
      PRIVATEMESH_DEMO_MODE: "true"
      PRIVATEMESH_SEARCH_NODE_HTTP_ADDRESS: :8090
      PRIVATEMESH_SEARCH_NODE_GRPC_ADDRESS: :8091
      PRIVATEMESH_NODE_DATA_DIR: /var/lib/privatemesh
      PRIVATEMESH_NODE_ID: node-a
      PRIVATEMESH_COLLECTION_ID: engineering
      PRIVATEMESH_NODE_ADVERTISE_ADDRESS: search-node-a:8091
      PRIVATEMESH_COORDINATOR_GRPC_ADDRESS: coordinator:8081
    ports:
      - "${PRIVATEMESH_NODE_A_HOST_PORT:-18091}:8090"
      - "${PRIVATEMESH_NODE_A_GRPC_HOST_PORT:-18093}:8091"
    volumes:
      - node-a-data:/var/lib/privatemesh
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy

  search-node-b:
    build:
      <<: *service-build
      args:
        SERVICE: search-node
    environment:
      <<: *service-environment
      PRIVATEMESH_DEMO_MODE: "true"
      PRIVATEMESH_SEARCH_NODE_HTTP_ADDRESS: :8090
      PRIVATEMESH_SEARCH_NODE_GRPC_ADDRESS: :8091
      PRIVATEMESH_NODE_DATA_DIR: /var/lib/privatemesh
      PRIVATEMESH_NODE_ID: node-b
      PRIVATEMESH_COLLECTION_ID: research
      PRIVATEMESH_NODE_ADVERTISE_ADDRESS: search-node-b:8091
      PRIVATEMESH_COORDINATOR_GRPC_ADDRESS: coordinator:8081
    ports:
      - "${PRIVATEMESH_NODE_B_HOST_PORT:-18092}:8090"
      - "${PRIVATEMESH_NODE_B_GRPC_HOST_PORT:-18094}:8091"
    volumes:
      - node-b-data:/var/lib/privatemesh
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    ports:
      - "${PRIVATEMESH_WEB_HOST_PORT:-18000}:8080"
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "${PRIVATEMESH_JAEGER_HOST_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PRIVATEMESH_PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - coordinator
      - search-node-a
      - search-node-b
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${PRIVATEMESH_GRAFANA_HOST_PORT:-13000}:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  node-a-data:
  node-b-data:
  prometheus-data:
  grafana-data:

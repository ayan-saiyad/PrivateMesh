apiVersion: v1
kind: Service
metadata:
  name: search-node-b
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: search-node-b
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: grpc
      port: 8091
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search-node-b
spec:
  serviceName: search-node-b
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search-node-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-node-b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-node
          image: ghcr.io/ayan-saiyad/privatemesh-search-node:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: grpc
              containerPort: 8091
          env:
            - name: PRIVATEMESH_DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: demo-mode
            - name: PRIVATEMESH_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: log-level
            - name: PRIVATEMESH_SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: shutdown-timeout
            - name: PRIVATEMESH_SEARCH_NODE_HTTP_ADDRESS
              value: :8090
            - name: PRIVATEMESH_SEARCH_NODE_GRPC_ADDRESS
              value: :8091
            - name: PRIVATEMESH_NODE_DATA_DIR
              value: /var/lib/privatemesh
            - name: PRIVATEMESH_NODE_ID
              value: node-b
            - name: PRIVATEMESH_COLLECTION_ID
              value: research
            - name: PRIVATEMESH_NODE_ADVERTISE_ADDRESS
              value: search-node-b:8091
            - name: PRIVATEMESH_COORDINATOR_GRPC_ADDRESS
              value: coordinator:8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/privatemesh
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

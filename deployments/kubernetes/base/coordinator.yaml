apiVersion: v1
kind: Service
metadata:
  name: coordinator
spec:
  selector:
    app.kubernetes.io/name: coordinator
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: ghcr.io/ayan-saiyad/privatemesh-coordinator:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          env:
            - name: PRIVATEMESH_DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: demo-mode
            - name: PRIVATEMESH_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: log-level
            - name: PRIVATEMESH_SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: privatemesh-runtime
                  key: shutdown-timeout
            - name: PRIVATEMESH_COORDINATOR_HTTP_ADDRESS
              value: :8080
            - name: PRIVATEMESH_COORDINATOR_GRPC_ADDRESS
              value: :8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

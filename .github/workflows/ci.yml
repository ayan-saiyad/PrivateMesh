name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./cmd/... ./gen/go/... ./internal/...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./cmd/... ./gen/go/... ./internal/...

      - name: Build
        run: |
          go build -trimpath -o bin/coordinator ./cmd/coordinator
          go build -trimpath -o bin/search-node ./cmd/search-node

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

  protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0

      - name: Lint contracts
        run: buf lint

      - name: Verify generated bindings
        run: buf generate

      - name: Check generated bindings
        run: git diff --exit-code -- gen/go

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
